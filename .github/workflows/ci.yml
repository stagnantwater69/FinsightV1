name: CI

# Runs what was previously only ever run by hand. Two client/server mismatches
# reached the repo undetected — mobile posting a field the API had stopped
# accepting, and a navigate() target with no screen behind it — because
# nothing checked either seam automatically. Both now have tests; this is what
# makes them count.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The suite truncates between files and needs a real Postgres — the same
    # arrangement backend/package.json's test:db:up creates locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: finsight_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The contract tests import the mobile and web payload builders across
      # project boundaries, so those installs are not optional here.
      - run: npm ci --prefix backend
      - run: npm ci --prefix mobile
      - run: npm ci --prefix web

      # working-directory already cds into backend; npx has no --prefix flag
      # (that's an npm-only flag), so passing it here just gets forwarded to
      # prisma itself, which doesn't recognize it and prints its help text.
      - run: npx prisma generate
        working-directory: backend
      - name: Verify Phase 2 reconciliation paths
        run: npm run migrate:verify-phase2-reconciliation
        working-directory: backend
        timeout-minutes: 10
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:55432/finsight_test
          DIRECT_URL: postgresql://testuser:testpass@localhost:55432/finsight_test
      # Explicit gate for "does the migration history apply cleanly to a
      # brand-new database", run separately from the test suite so a
      # migration failure shows up as its own red step instead of buried
      # inside a `npm test` log. tests/setup/globalSetup.ts (below, via `npm
      # test`) also runs `prisma migrate deploy` — that's not a duplicate
      # mistake, it's idempotent and globalSetup needs it standalone so the
      # test suite works the same way on a laptop with no separate CI step.
      - run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:55432/finsight_test
          DIRECT_URL: postgresql://testuser:testpass@localhost:55432/finsight_test
      # A migrated fresh database must match schema.prisma exactly. Nine index
      # names drifted for months (DATA-DRIFT-01: Postgres truncated the
      # migration-authored names to 63 bytes, Prisma later computed different
      # short names) because nothing diffed the two. --exit-code makes any
      # difference — a dropped index, a stray column — a red step.
      - run: >-
          npx prisma migrate diff
          --from-url "$DATABASE_URL"
          --to-schema-datamodel prisma/schema.prisma
          --exit-code
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:55432/finsight_test
      # Web and mobile each carry a copy of the shared API types. The script
      # only compares exported NAMES (the contract tests below cover shapes),
      # but it was never wired into CI and drifted to 16 mismatches
      # (CONTRACT-01). Exemptions live in the script with a reason each.
      - run: node scripts/check-type-parity.mjs
      - run: npm run typecheck --prefix backend
      - run: npm run lint --prefix backend
      # Compiles the actual production artifact (dist/) that Dockerfile's
      # build stage and `npm start` both depend on. typecheck alone
      # (--noEmit) does not catch every failure mode tsc's emit path can hit.
      - run: npm run build --prefix backend
      - run: npm run ops:receipt-provider:smoke
        working-directory: backend
      - run: npm run ops:receipt-queue:smoke
        working-directory: backend
      - run: npm run ops:receipt-provider:status -- --require-disabled
        working-directory: backend
        env:
          RECEIPT_PROVIDER_DISPATCH_ENABLED: "false"
          RECEIPT_PROVIDER_KILL_SWITCH: "true"
          RECEIPT_PROVIDER_MONTHLY_UNIT_LIMIT: "0"
          GOOGLE_GEMINI_API_KEY: "non-secret-ci-placeholder"
      # The probe verifies PostgreSQL reports an explicit read-only transaction
      # before it reads migration, queue, cleanup, or provider-budget counts.
      - run: npm run ops:receipt-queue:readiness
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:55432/finsight_test
      - run: npm test --prefix backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:55432/finsight_test
      # Non-blocking: report-only, not a merge gate, until a maintainer
      # triages these. As of 2026-08-21, `npm audit --audit-level=high`
      # here finds 3 high findings, all inside `prisma`'s own dev-time CLI
      # dependency chain (deepmerge-ts via @prisma/config via prisma) —
      # nothing in the runtime dependency graph the built image ships (the
      # Dockerfile's runtime stage never installs the `prisma` CLI, only the
      # generated @prisma/client). continue-on-error surfaces the failed
      # step (and its annotation) in the Actions UI without failing the job,
      # so new findings stay visible instead of silently passing.
      - run: npm audit --audit-level=high --prefix backend
        continue-on-error: true

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run lint --prefix web
      # Compiles the actual production bundle `vite build` emits (tsc -b +
      # rollup), not just the --noEmit typecheck above. Confirmed this needs
      # no Supabase env vars: nothing at module top level calls the client
      # during a build, only when a component actually renders in a browser.
      - run: npm run build --prefix web
      # Fails the job if any web/dist/assets/*.js chunk exceeds the budget in
      # web/scripts/check-bundle-budget.mjs — a regression tripwire, not a
      # target to chase down to zero (see that script's header comment for
      # why the current large chunks are legitimate vendor weight).
      - run: npm run check:bundle-budget --prefix web
      # supabaseClient.ts throws at import time if either is empty, which
      # takes down any unit test that imports it transitively (api.ts,
      # AuthContext.tsx, ...) before a single test in the file can run —
      # same reason the e2e step below sets them.
      - run: npm test --prefix web
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          VITE_API_BASE_URL: "http://localhost:4000/api/v1"
      # The Playwright browser Chromium ships needs its own OS deps installed
      # on the runner image; --with-deps handles both in one step.
      - run: npx --prefix web playwright install --with-deps chromium
      # auth-shell.spec.ts only exercises the public login/recover/register
      # shell — it never calls Supabase — so these are placeholder values,
      # not secrets. supabaseClient.ts throws at import time if either is
      # empty, which would otherwise take the whole dev server down before
      # Playwright could load a single page.
      - run: npm run test:e2e --prefix web
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          VITE_API_BASE_URL: "http://localhost:4000/api/v1"
      # Non-blocking: report-only, not a merge gate, until a maintainer
      # triages this. As of 2026-08-21, `npm audit --audit-level=high` here
      # finds 1 high finding (nanoid, a transitive dev-tooling dependency —
      # not shipped in the built bundle). continue-on-error surfaces the
      # failed step in the Actions UI without failing the job.
      - run: npm audit --audit-level=high --prefix web
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    # Verifies the two things docs/DEPLOYMENT-HARDENING-PLAN.md's own
    # Verification section requires and that, until now, only ran by hand:
    # `docker compose config` parses, and nginx/nginx.conf passes `nginx -t`
    # in the same image tag docker-compose.yml pins. Also builds the real
    # backend image (Dockerfile) and proves it boots and answers a real
    # request that round-trips to Postgres — not the compose topology (no
    # nginx hop, no TLS), just the image itself.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: finsight_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml points backend's env_file at backend/.env, which is
      # gitignored and never present in CI. `docker compose config` refuses to
      # even parse without it — not because the values are read, only because
      # the file must exist — so a placeholder copy of the example file is
      # enough. Nothing here starts a container.
      - run: cp backend/.env.example backend/.env
      - run: docker compose config --quiet
      # nginx.conf's upstream block names the backend service by its
      # docker-compose hostname. `nginx -t` resolves upstream hosts as part of
      # loading the config even though it never connects to them, so bare
      # `nginx -t` fails outside the compose network with "host not found".
      # --add-host satisfies that resolution without needing the backend
      # service actually running.
      - run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t
      - run: bash nginx/verify-upload-envelope.sh
      - run: bash backend/docker/verify-receipt-upload-orphan-sweep.sh
      - run: bash backend/docker/verify-api-entrypoint-signal.sh
      - run: bash backend/docker/verify-receipt-worker-readiness.sh

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The runtime image ships no `prisma` CLI on purpose (see the Dockerfile
      # comment on the deps stage) — only the generated client. Migrations
      # against the throwaway DB have to run from outside the image, the same
      # as any real deploy would run them from a CI/CD step or operator
      # shell, never from inside the running container.
      - run: npm ci --prefix backend
      - run: npx prisma migrate deploy
        working-directory: backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:55432/finsight_test
          DIRECT_URL: postgresql://testuser:testpass@localhost:55432/finsight_test

      # Both targets, named explicitly, then a CMD check on each: an untargeted
      # build once resolved to the worker stage (OPS-DEPLOY-01), which would
      # have made the smoke below poll an image that never listens.
      - run: docker build --target api -t finsight-backend:ci ./backend
      - run: docker build --target worker -t finsight-worker:ci ./backend
      - name: Verify production dependency boundary
        run: |
          docker run --rm --entrypoint sh finsight-backend:ci -c '
            test ! -e /app/node_modules/prisma
            test ! -e /app/node_modules/.bin/prisma
            test ! -e /app/node_modules/@prisma/config
            test ! -e /app/node_modules/deepmerge-ts
            test -s /app/node_modules/.prisma/client/libquery_engine-debian-openssl-3.0.x.so.node
          '
      - run: |
          api_cmd="$(docker inspect --format '{{json .Config.Cmd}}' finsight-backend:ci)"
          worker_cmd="$(docker inspect --format '{{json .Config.Cmd}}' finsight-worker:ci)"
          api_entrypoint="$(docker inspect --format '{{json .Config.Entrypoint}}' finsight-backend:ci)"
          worker_entrypoint="$(docker inspect --format '{{json .Config.Entrypoint}}' finsight-worker:ci)"
          default_cmd="$(docker build -q ./backend | xargs docker inspect --format '{{json .Config.Cmd}}')"
          echo "api: $api_cmd  api entrypoint: $api_entrypoint  worker: $worker_cmd  worker entrypoint: $worker_entrypoint  default: $default_cmd"
          [ "$api_cmd" = '["node","dist/server.js"]' ]
          [ "$worker_cmd" = '["node","dist/worker.js"]' ]
          [ "$api_entrypoint" = '["/usr/local/bin/finsight-api-entrypoint"]' ]
          [ "$worker_entrypoint" = '["/usr/local/bin/finsight-worker-entrypoint"]' ]
          [ "$default_cmd" = '["node","dist/server.js"]' ]

      - run: |
          docker run -d --name finsight-worker-health-smoke --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            finsight-worker:ci node -e 'setInterval(() => {}, 1000)'
          for i in $(seq 1 30); do
            state="$(docker inspect --format '{{.State.Health.Status}}' finsight-worker-health-smoke)"
            if [ "$state" = healthy ]; then break; fi
            if [ "$state" = unhealthy ]; then exit 1; fi
            sleep 1
          done
          [ "$(docker inspect --format '{{.State.Health.Status}}' finsight-worker-health-smoke)" = healthy ]
      - if: always()
        run: docker rm -f finsight-worker-health-smoke || true

      # Exercise the application OCR path from the production worker image,
      # with no network interface and no writable image filesystem. A cache
      # miss would try Tesseract.js's CDN and make this cold-start gate fail.
      - run: |
          docker run --rm -i --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,noexec,size=64m \
            -e DATABASE_URL="postgresql://offline:offline@127.0.0.1/offline" \
            -e DIRECT_URL="postgresql://offline:offline@127.0.0.1/offline" \
            -e SUPABASE_URL="https://example.supabase.co" \
            -e SUPABASE_ANON_KEY="ci-placeholder-anon-key" \
            -e SUPABASE_SERVICE_ROLE_KEY="ci-placeholder-service-role-key" \
            -e TRUST_PROXY_HOPS=0 \
            --entrypoint node \
            finsight-worker:ci - <<'NODE'
          const { extractText } = require("./dist/services/ocr.service.js");
          const receipt = Buffer.from(
            "",
            "base64",
          );

          (async () => {
            const text = await extractText(receipt);
            if (!/TOTAL\s+123[.,]45/.test(text)) {
              throw new Error(`Unexpected offline OCR output: ${JSON.stringify(text)}`);
            }
            console.log("Offline English OCR passed with packaged language data.");
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      # The worker must reject a configured language that the image does not
      # contain. The API image is left independent so manual entry stays up.
      - run: |
          if docker run --rm --network none \
            -e TESSERACT_LANG=missing \
            finsight-worker:ci true; then
            echo "Worker started without its configured language data" >&2
            exit 1
          fi

      # --network host: the container needs to reach the postgres *service
      # container*, which GitHub Actions publishes on the runner's own
      # localhost, not on a user-defined bridge network the app container is
      # also on. Confirmed locally that plain `docker run -p` on a bridge
      # network can't reach a service container's published port here, and
      # host networking is exactly what a real bare-metal/systemd deploy (the
      # runbook's non-compose path) looks like anyway.
      #
      # Supabase vars are unreachable-but-well-formed placeholders: nothing
      # this smoke test hits calls Supabase, and env.ts's zod schema rejects
      # boot with a malformed SUPABASE_URL, so it has to be a real URL shape.
      - run: |
          docker run -d --name finsight-backend-smoke --network host \
            -e DATABASE_URL="postgresql://testuser:testpass@127.0.0.1:55432/finsight_test" \
            -e DIRECT_URL="postgresql://testuser:testpass@127.0.0.1:55432/finsight_test" \
            -e SUPABASE_URL="https://example.supabase.co" \
            -e SUPABASE_ANON_KEY="ci-placeholder-anon-key" \
            -e SUPABASE_SERVICE_ROLE_KEY="ci-placeholder-service-role-key" \
            -e PORT=4577 \
            -e NODE_ENV=development \
            finsight-backend:ci

      # Polls rather than sleeping a fixed amount: the compose healthcheck
      # gives the app a 40s start_period for Prisma's connection setup, and a
      # flat sleep would either waste that budget every green run or flake
      # under load. /health/live only proves the process is up; /health/ready
      # is the actual API-to-database smoke journey — it runs `SELECT 1` and
      # several real Prisma queries against the migrated schema above.
      - run: |
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:4577/api/v1/health/live > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:4577/api/v1/health/live
          echo
          echo "Checking /health/ready hits a real database round trip..."
          response="$(curl -sf http://127.0.0.1:4577/api/v1/health/ready)"
          echo "$response"
          echo "$response" | grep -q '"database":"ok"'
      - if: always()
        run: docker logs finsight-backend-smoke || true
      - if: always()
        run: docker rm -f finsight-backend-smoke || true

  ml:
    runs-on: ubuntu-latest
    # ml/ is the Python side of the Isolation Forest shadow detector (see
    # ml/README.md). Nothing here previously ran its tests or checked its
    # pinned dependencies actually install together.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r ml/requirements.txt
      # Confirms the pinned versions in requirements.txt don't conflict with
      # each other or with anything pip already resolved transitively.
      - run: pip check
      - run: python -m unittest discover -s ml/worker -v

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix mobile
      # webParity.test.ts and helpContent.test.ts import straight from
      # web/src for parity checks, so tsc needs web's own deps (react) on
      # disk to resolve types when it follows those imports.
      - run: npm ci --prefix web
      # tsc was run by hand throughout the work that added these screens —
      # mobile had no typecheck script at all until now.
      - run: npm run typecheck --prefix mobile
      # oxlint mirrors what the web job runs. The typography token guard rides
      # along in the same script because tsc cannot see the drift it catches —
      # a raw fontSize is just a number.
      - run: npm run lint --prefix mobile
      - run: npm test --prefix mobile
      # Non-blocking: report-only, not a merge gate. As of 2026-08-21, `npm
      # audit --audit-level=high --prefix mobile` finds 16 findings (8 high,
      # 8 moderate), rooted in Expo's own config-plugins/xcode tooling chain
      # (uuid, metro-transform-worker) — dev/build tooling, not runtime app
      # code. `npm audit fix --force` there pulls a breaking Expo SDK bump,
      # which is exactly the kind of change this pipeline should not make
      # unilaterally. continue-on-error surfaces the failed step in the
      # Actions UI without failing the job, so new findings stay visible.
      - run: npm audit --audit-level=high --prefix mobile
        continue-on-error: true
