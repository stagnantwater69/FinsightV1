name: CI

# Runs what was previously only ever run by hand. Two client/server mismatches
# reached the repo undetected — mobile posting a field the API had stopped
# accepting, and a navigate() target with no screen behind it — because
# nothing checked either seam automatically. Both now have tests; this is what
# makes them count.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    # The suite truncates between files and needs a real Postgres — the same
    # arrangement backend/package.json's test:db:up creates locally.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: finsight_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The contract tests import the mobile and web payload builders across
      # project boundaries, so those installs are not optional here.
      - run: npm ci --prefix backend
      - run: npm ci --prefix mobile
      - run: npm ci --prefix web

      - run: npm run typecheck --prefix backend
      - run: npm run lint --prefix backend
      - run: npx prisma generate --prefix backend
        working-directory: backend
      - run: npm test --prefix backend
        env:
          DATABASE_URL: postgresql://testuser:testpass@localhost:55432/finsight_test

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix web
      - run: npm run typecheck --prefix web
      - run: npm run lint --prefix web
      - run: npm test --prefix web
      # The Playwright browser Chromium ships needs its own OS deps installed
      # on the runner image; --with-deps handles both in one step.
      - run: npx --prefix web playwright install --with-deps chromium
      # auth-shell.spec.ts only exercises the public login/recover/register
      # shell — it never calls Supabase — so these are placeholder values,
      # not secrets. supabaseClient.ts throws at import time if either is
      # empty, which would otherwise take the whole dev server down before
      # Playwright could load a single page.
      - run: npm run test:e2e --prefix web
        env:
          VITE_SUPABASE_URL: "https://example.supabase.co"
          VITE_SUPABASE_ANON_KEY: "ci-placeholder-anon-key"
          VITE_API_BASE_URL: "http://localhost:4000/api/v1"

  docker:
    runs-on: ubuntu-latest
    # Verifies the two things docs/DEPLOYMENT-HARDENING-PLAN.md's own
    # Verification section requires and that, until now, only ran by hand:
    # `docker compose config` parses, and nginx/nginx.conf passes `nginx -t`
    # in the same image tag docker-compose.yml pins.
    steps:
      - uses: actions/checkout@v4
      # docker-compose.yml points backend's env_file at backend/.env, which is
      # gitignored and never present in CI. `docker compose config` refuses to
      # even parse without it — not because the values are read, only because
      # the file must exist — so a placeholder copy of the example file is
      # enough. Nothing here starts a container.
      - run: cp backend/.env.example backend/.env
      - run: docker compose config
      # nginx.conf's upstream block names the backend service by its
      # docker-compose hostname. `nginx -t` resolves upstream hosts as part of
      # loading the config even though it never connects to them, so bare
      # `nginx -t` fails outside the compose network with "host not found".
      # --add-host satisfies that resolution without needing the backend
      # service actually running.
      - run: |
          docker run --rm --add-host backend:127.0.0.1 \
            -v "$(pwd)/nginx/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --prefix mobile
      # tsc was run by hand throughout the work that added these screens —
      # mobile had no typecheck script at all until now.
      - run: npm run typecheck --prefix mobile
      # oxlint mirrors what the web job runs. The typography token guard rides
      # along in the same script because tsc cannot see the drift it catches —
      # a raw fontSize is just a number.
      - run: npm run lint --prefix mobile
      - run: npm test --prefix mobile
