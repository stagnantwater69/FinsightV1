<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The app chrome, browser tab, and home-screen shortcut use the same transparent mascot. -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-newmascot-v2-48.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-newmascot-v2-180.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinSight — Know where your money actually goes</title>
    <meta name="description" content="FinSight helps small business owners track expenses and sales, spot unusual spending, and see how much they need to cover the month — in plain language." />
    <meta name="theme-color" content="#0e655c" />
    <!--
      Theme boot — runs before first paint, deliberately blocking.

      The saved theme lives in localStorage, which React cannot read until its
      bundle has downloaded and executed. Without this the page paints in
      Classic and then snaps to Dark a few hundred milliseconds later: a white
      flash straight into the eyes of the person who specifically chose dark.

      So it is inline (no network round-trip), synchronous (blocks the first
      paint rather than racing it), and in <head> before any stylesheet is
      applied. It only ever sets one attribute; ThemeContext owns everything
      afterwards and re-reads the same key, so the two cannot disagree.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("finsight.theme");
          document.documentElement.dataset.theme =
            t === "dark" || t === "light" || t === "classic" ? t : "classic";
        } catch (e) {
          document.documentElement.dataset.theme = "classic";
        }
      })();
    </script>
    <!--
      Landing theme boot — same reasoning as the theme boot above, for the
      public marketing page's own separate light/dark toggle (PublicLayout).
      A different attribute (`data-landing-theme`) so it can never collide
      with or be read by the authenticated app's `data-theme`.
    -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("finsight.landingTheme");
          document.documentElement.dataset.landingTheme = t === "dark" ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.landingTheme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
