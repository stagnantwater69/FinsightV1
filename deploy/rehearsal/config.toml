# Supabase CLI config for one throwaway stack in run-local-supabase.sh.
# @PROJECT_ID@ and the ports are replaced per stack; each stack signs with its
# own key, and the target runs on other ports, so its hostname differs.
project_id = "@PROJECT_ID@"

[api]
enabled = true
port = @API_PORT@
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = @DB_PORT@
shadow_port = @SHADOW_PORT@
major_version = 17

[db.migrations]
enabled = false

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[inbucket]
enabled = false

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.s3_protocol]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
signing_keys_path = "./signing_keys.json"

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = false

[analytics]
enabled = false
