<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">FinSight Network Model</title>
  <desc id="desc">A small-business owner uses the web or mobile client over HTTPS. The clients connect to Supabase Auth and the FinSight API. The API and its workers connect to Supabase PostgreSQL, Storage, local OCR, and optional external AI providers.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/></marker>
    <style>
      .title{font:700 30px Arial,sans-serif;fill:#0f172a}.subtitle{font:16px Arial,sans-serif;fill:#475569}.group{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.optional{fill:#fffbeb;stroke:#d97706;stroke-width:2;stroke-dasharray:8 6}.node{fill:#fff;stroke:#334155;stroke-width:2}.accent{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.cloud{fill:#f0fdf4;stroke:#16a34a;stroke-width:2}.label{font:700 17px Arial,sans-serif;fill:#0f172a;text-anchor:middle}.small{font:14px Arial,sans-serif;fill:#475569;text-anchor:middle}.group-label{font:700 16px Arial,sans-serif;fill:#334155}.line{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}.dash{fill:none;stroke:#b45309;stroke-width:2.5;stroke-dasharray:8 6;marker-end:url(#arrow)}.edge-label{font:13px Arial,sans-serif;fill:#334155;text-anchor:middle}.note{font:14px Arial,sans-serif;fill:#475569}.legend{font:13px Arial,sans-serif;fill:#475569}
    </style>
  </defs>

  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="48" class="title" text-anchor="middle">FinSight Network Model</text>
  <text x="700" y="76" class="subtitle" text-anchor="middle">Implemented logical architecture and communication paths</text>

  <rect x="38" y="280" width="170" height="150" rx="18" class="node"/>
  <circle cx="123" cy="326" r="17" fill="#334155"/>
  <path d="M88 377c4-27 20-39 35-39s31 12 35 39" fill="#334155"/>
  <text x="123" y="397" class="label">Small-Business</text><text x="123" y="419" class="label">Owner</text>

  <rect x="250" y="160" width="285" height="405" rx="20" class="group"/>
  <text x="270" y="190" class="group-label">USER DEVICES</text>
  <rect x="292" y="230" width="200" height="105" rx="14" class="accent"/>
  <rect x="332" y="250" width="120" height="58" rx="3" fill="none" stroke="#2563eb" stroke-width="3"/>
  <text x="392" y="327" class="label">React Web App</text>
  <rect x="292" y="390" width="200" height="105" rx="14" class="accent"/>
  <rect x="363" y="407" width="58" height="70" rx="8" fill="none" stroke="#2563eb" stroke-width="3"/>
  <circle cx="392" cy="468" r="3" fill="#2563eb"/>
  <text x="392" y="487" class="label">Expo Mobile App</text>

  <rect x="590" y="120" width="400" height="535" rx="20" class="group"/>
  <text x="610" y="150" class="group-label">FINSIGHT APPLICATION ENVIRONMENT</text>
  <rect x="650" y="190" width="280" height="76" rx="14" class="node"/>
  <text x="790" y="221" class="label">HTTPS Reverse Proxy</text><text x="790" y="245" class="small">TLS / request routing</text>
  <rect x="650" y="310" width="280" height="90" rx="14" class="accent"/>
  <text x="790" y="346" class="label">Express / TypeScript API</text><text x="790" y="372" class="small">Authentication and business logic</text>
  <rect x="650" y="447" width="280" height="90" rx="14" class="node"/>
  <text x="790" y="483" class="label">In-process Workers</text><text x="790" y="509" class="small">Receipt and anomaly jobs</text>
  <rect x="650" y="575" width="280" height="55" rx="14" class="node"/>
  <text x="790" y="599" class="label">Local OCR</text><text x="790" y="619" class="small">Sharp + Tesseract.js</text>

  <rect x="1040" y="105" width="320" height="430" rx="20" class="group"/>
  <text x="1060" y="135" class="group-label">SUPABASE CLOUD SERVICES</text>
  <rect x="1090" y="170" width="220" height="80" rx="14" class="cloud"/>
  <text x="1200" y="204" class="label">Supabase Auth</text><text x="1200" y="229" class="small">Sessions and identity</text>
  <rect x="1090" y="300" width="220" height="80" rx="14" class="cloud"/>
  <ellipse cx="1200" cy="320" rx="55" ry="12" fill="none" stroke="#16a34a" stroke-width="2"/>
  <path d="M1145 320v24c0 7 25 13 55 13s55-6 55-13v-24" fill="none" stroke="#16a34a" stroke-width="2"/>
  <text x="1200" y="373" class="label">PostgreSQL</text>
  <rect x="1090" y="430" width="220" height="70" rx="14" class="cloud"/>
  <text x="1200" y="461" class="label">Supabase Storage</text><text x="1200" y="483" class="small">Receipts and profile media</text>

  <rect x="1040" y="590" width="320" height="185" rx="20" class="optional"/>
  <text x="1060" y="620" class="group-label">OPTIONAL EXTERNAL AI SERVICES</text>
  <rect x="1080" y="650" width="115" height="78" rx="14" class="node"/><text x="1138" y="682" class="label">Google</text><text x="1138" y="705" class="label">Gemini</text>
  <rect x="1210" y="650" width="115" height="78" rx="14" class="node"/><text x="1268" y="682" class="label">OpenRouter</text><text x="1268" y="705" class="small">fallback</text>

  <path d="M208 334 L292 282" class="line"/><path d="M208 374 L292 442" class="line"/>
  <path d="M492 282 C555 282 580 228 650 228" class="line"/><path d="M492 442 C565 442 580 255 650 240" class="line"/>
  <text x="568" y="277" class="edge-label">HTTPS</text>
  <path d="M790 266 L790 310" class="line"/><path d="M790 400 L790 447" class="line"/><path d="M790 537 L790 575" class="line"/>
  <path d="M492 263 H550 V95 H1015 V190 L1090 205" class="line"/><path d="M492 422 H565 V108 H1000 V200 L1090 215" class="line"/>
  <text x="790" y="89" class="edge-label">TLS · user session</text>
  <path d="M930 340 C1000 340 1020 210 1090 210" class="line"/>
  <path d="M930 350 L1090 340" class="line"/>
  <path d="M930 370 C1010 395 1020 465 1090 465" class="line"/>
  <path d="M930 492 C1000 492 1020 360 1090 350" class="line"/>
  <path d="M930 492 C1010 530 1020 674 1080 682" class="dash"/>
  <path d="M930 365 C1040 520 1110 650 1210 682" class="dash"/>

  <line x1="50" y1="825" x2="100" y2="825" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow)"/><text x="115" y="830" class="legend">Required communication path</text>
  <line x1="345" y1="825" x2="395" y2="825" stroke="#b45309" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#arrow)"/><text x="410" y="830" class="legend">Optional, only when configured</text>
  <text x="50" y="866" class="note">The public internet/ISP transports encrypted traffic; it is not a FinSight application component.</text>
</svg>
