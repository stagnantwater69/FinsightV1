services:
  backend:
    # `api` target named explicitly: the Dockerfile's stage order once made an
    # untargeted build resolve to the worker image, whose CMD never listens on
    # :4000, so this healthcheck failed forever and nginx never started.
    build:
      context: ./backend
      target: api
    env_file: ./backend/.env
    # `expose`, NOT `ports`, and the difference is a security control.
    #
    # Published on the host, the API answered on :4000 as well as through nginx
    # — which bypassed anything nginx does, including TLS once it terminates
    # here, and split every IP-keyed rate limit into two bucket spaces:
    # TRUST_PROXY_HOPS=1 reads X-Forwarded-For on the proxied path and the raw
    # socket address on the direct one, so one caller counted as two identities
    # against the same limiter.
    #
    # For local debugging against the container, add this DELIBERATELY and bind
    # it to the loopback interface so it is not reachable off the machine:
    #   ports:
    #     - "127.0.0.1:4000:4000"
    expose:
      - "4000"
    environment:
      RECEIPT_UPLOAD_TEMP_ROOT: /run/finsight/receipt-uploads
    # One owner can have one full upload and one retry in flight. 192 MiB
    # holds those two 80 MiB aggregates plus filesystem overhead, then fails
    # closed instead of consuming the host disk. This is container-private
    # tmpfs, not a bind or named host volume, and disappears on restart.
    tmpfs:
      - /run/finsight/receipt-uploads:rw,noexec,nosuid,nodev,size=201326592,mode=0700,uid=1000,gid=1000
    restart: unless-stopped
    # Node allows 10 seconds to drain HTTP; leave the wrapper time to reap it.
    stop_grace_period: 15s
    healthcheck:
      # `restart: unless-stopped` only catches a process that has EXITED. The
      # failure that actually happens is a process still running and no longer
      # answering — an exhausted pool, a wedged event loop. This is what
      # notices that, and what stops nginx routing to a backend that has not
      # finished booting.
      #
      # Node rather than curl or wget: the runtime image is `-slim` and has
      # neither, and adding one to run a healthcheck would put a whole HTTP
      # client in the image for the sake of a status code.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4000/api/v1/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Generous, because a cold start runs Prisma's connection setup and the
      # first worker pass. Failures during this window do not count.
      start_period: 40s

  worker:
    # Same image, `worker` target: the background queue consumers (receipt
    # scans, CSV imports, anomaly analysis, account deletion) and periodic
    # sweeps, split into their own process — see backend/src/worker.ts. No
    # `expose`/`ports`: this process serves no HTTP traffic. Scale this
    # service independently of `backend` to add worker throughput without
    # adding API capacity, or vice versa.
    build:
      context: ./backend
      target: worker
    env_file: ./backend/.env
    environment:
      RECEIPT_WORKER_HEALTH_DIR: /run/finsight/worker-health
    tmpfs:
      - /run/finsight/worker-health:rw,noexec,nosuid,nodev,size=1048576,mode=0700,uid=1000,gid=1000
    restart: unless-stopped
    stop_grace_period: 35s

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"
      # Uncomment together with the HTTPS server block in nginx/nginx.conf.
      # - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Certificates are never committed. Mount them here when TLS terminates
      # at this container:
      # - /etc/letsencrypt/live/your-domain.example:/etc/nginx/certs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
