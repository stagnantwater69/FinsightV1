events {}

http {
  # `client_max_body_size` IS THE ONE SETTING THIS FILE EXISTS FOR.
  #
  # nginx defaults it to 1m. The app accepts up to MAX_PAGES (8) receipt
  # photographs of up to 10 MB each in a single multipart request — see
  # backend/src/middleware/upload.middleware.ts and receipt.routes.ts. With the
  # default, every real receipt upload died on a bare nginx 413 before the
  # backend saw it: no quality check, no per-file message, nothing the app could
  # explain. It worked in `npm run dev` because there is no proxy there, which
  # is exactly why it went unnoticed.
  #
  # 88m = 8 × 10 MB, plus headroom for multipart boundaries and field parts.
  # This is a CEILING, not the rule: the per-file limit stays in multer, so the
  # owner still gets "Receipt image must be JPEG, PNG, or WEBP" and the 10 MB
  # message from the application rather than a 413 from nginx.
  #
  # Raising MAX_PAGES without raising this reintroduces the bug, so a test
  # asserts the two agree — see backend/tests/unit/uploadLimits.test.ts.
  client_max_body_size 88m;

  # Streamed straight through rather than buffered to disk first. These bodies
  # are large and the backend reads them into memory anyway; buffering would add
  # a disk write and a copy to every scan.
  proxy_request_buffering off;

  # Sized for the request this proxy actually carries: eight photographs from a
  # phone on a shop's connection. nginx's 60s default is comfortable for JSON
  # and marginal for that, and a timeout mid-upload is indistinguishable from a
  # broken app to the person holding the phone.
  proxy_connect_timeout 10s;
  proxy_send_timeout    300s;
  proxy_read_timeout    300s;
  client_body_timeout   300s;

  # Compression for the JSON the dashboard and insights endpoints return, which
  # is the bulk of what an owner downloads. Images and PDFs are already
  # compressed and are deliberately not listed.
  gzip on;
  gzip_types application/json application/javascript text/css text/plain;
  gzip_min_length 1024;

  # Not the same set helmet sets, and that is the point: helmet's headers ride
  # on application responses, so nginx's OWN responses — a 413, a 502, a
  # timeout — carry none of them. These are the few that still mean something on
  # an error page nginx generated itself.
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;

  server_tokens off;

  upstream finsight_backend {
    server backend:4000;
    keepalive 16;
  }

  # ---------------------------------------------------------------------------
  # HTTP
  #
  # TWO CORRECT SHAPES, and which one applies depends on where TLS terminates.
  #
  #   (a) TLS TERMINATES HERE. Uncomment the HTTPS server below, mount the
  #       certificate, and replace this block's body with the redirect that is
  #       commented out inside it. Port 80 then serves nothing but the redirect.
  #
  #   (b) TLS TERMINATES IN FRONT (a platform load balancer, Cloudflare, a
  #       Caddy/Traefik ingress). Leave this as it is — but then the hop count
  #       in TRUST_PROXY_HOPS must count that proxy TOO, or every IP-keyed rate
  #       limit resolves to the wrong address. See backend/.env.example.
  #
  # What is NOT correct is leaving this serving plaintext as the public edge.
  # Bearer tokens for a financial record system would cross the wire in the
  # clear, and every control in docs/AUTH-HARDENING-PLAN.md is moot if they do.
  # ---------------------------------------------------------------------------
  server {
    listen 80;

    # For shape (a), delete everything below this line in this block and
    # uncomment the redirect:
    # return 301 https://$host$request_uri;

    location / {
      proxy_pass http://finsight_backend;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  # ---------------------------------------------------------------------------
  # HTTPS — shape (a). Mount a certificate and uncomment.
  #
  # Certificates are deliberately not in this repository. Get them from Let's
  # Encrypt (certbot writes to /etc/letsencrypt/live/<domain>/) and mount that
  # directory into the nginx container read-only.
  # ---------------------------------------------------------------------------
  # server {
  #   listen 443 ssl;
  #   http2 on;
  #   server_name your-domain.example;
  #
  #   ssl_certificate     /etc/nginx/certs/fullchain.pem;
  #   ssl_certificate_key /etc/nginx/certs/privkey.pem;
  #
  #   # TLS 1.2 is kept because Android below 10 does not negotiate 1.3, and
  #   # this product's market runs older phones. Drop it once that stops being
  #   # true for the installed base.
  #   ssl_protocols TLSv1.2 TLSv1.3;
  #   ssl_prefer_server_ciphers off;
  #   ssl_session_cache shared:SSL:10m;
  #   ssl_session_timeout 1d;
  #
  #   # Two years, and it is not casually reversible: browsers honour the age
  #   # they were last told. Turn it on only once HTTPS is known to work on
  #   # every hostname this serves.
  #   add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
  #
  #   location / {
  #     proxy_pass http://finsight_backend;
  #     proxy_http_version 1.1;
  #     proxy_set_header Connection "";
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  # }
}
